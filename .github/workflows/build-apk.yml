name: Build KastamonuShop APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout KastamonuShop (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust Toolchain (1.95+) & Android arm64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/kastamonushop-ffi
          cache-on-failure: true

      - name: Install Android NDK r27
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Apply KastamonuShop Android compatibility patches
        run: bash scripts/apply-patches.sh

      - name: Run StonebridgeCraft Automated Engine Tests (v0.8)
        working-directory: rust/kastamonushop-ffi
        env:
          CRAFT_I18N_DIR: ${{ github.workspace }}/third_party/craft-i18n
        run: cargo test --lib -- --nocapture

      - name: Build libkastamonushop_ffi.so (arm64-v8a) & Generate Kotlin UniFFI Bindings
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CRAFT_I18N_DIR: ${{ github.workspace }}/third_party/craft-i18n
        run: bash scripts/build-rust-android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Assemble StonebridgeCraft Release APK (Fast Compose/ART)
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Upload KastamonuShop APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StonebridgeCraft-arm64-debug-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
